name: CI

on:
  push:
    branches: [ main, 'dev/**' ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Node tool tests (.mjs, zero-dependency)
        run: node --test $(find plugins -name '*.test.mjs' -not -path '*/node_modules/*')

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Python tool tests (authenticating skill)
        run: python plugins/pentest/skills/authenticating/tools/test_auth_tools.py
